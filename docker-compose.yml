services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bancassurance
      MYSQL_USER: banca
      MYSQL_PASSWORD: banca
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ubanca -pbanca --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
