services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bancassurance
      MYSQL_USER: banca
      MYSQL_PASSWORD: banca
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
