name: Create GitHub work from Jira

on:
  repository_dispatch:
    types: [jira-plan-ready]

concurrency:
  group: jira-plan-ready-${{ github.event.client_payload.ticketKey }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  create-work:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue and branch
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload ?? {};
            const ticketKey = String(payload.ticketKey ?? '').trim().toUpperCase();
            const summary = String(payload.summary ?? '').trim();
            const description = String(payload.description ?? '').trim();
            const jiraUrl = String(payload.jiraUrl ?? '').trim();

            if (!/^[A-Z][A-Z0-9]+-\d+$/.test(ticketKey)) {
              core.setFailed('client_payload.ticketKey must look like BNC-123.');
              return;
            }

            if (!summary || !description || !jiraUrl) {
              core.setFailed('summary, description, and jiraUrl are required before PLAN READY.');
              return;
            }

            try {
              const parsedJiraUrl = new URL(jiraUrl);
              if (parsedJiraUrl.protocol !== 'https:') throw new Error('Jira URL must use HTTPS.');
            } catch (error) {
              core.setFailed(`client_payload.jiraUrl is invalid: ${error.message}`);
              return;
            }

            const branchSlug = summary
              .normalize('NFKC')
              .replace(/[^\p{L}\p{N}]+/gu, '-')
              .replace(/-+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 60)
              .replace(/-+$/g, '');

            if (!branchSlug) {
              core.setFailed('summary did not contain any characters that can be used in a branch name.');
              return;
            }

            const requestedBranchName = `${ticketKey}-${branchSlug}`;
            const marker = `<!-- jira-key:${ticketKey} -->`;
            const title = `[${ticketKey}] ${summary}`.slice(0, 256);

            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const defaultBranch = repository.data.default_branch;
            const baseRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`,
            });

            const findBranchesForTicket = () => github.paginate(
              github.rest.git.listMatchingRefs,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${ticketKey}-`,
                per_page: 100,
              },
            );

            let matchingRefs = await findBranchesForTicket();
            if (matchingRefs.length > 1) {
              core.setFailed([
                `Multiple branches exist for ${ticketKey}:`,
                ...matchingRefs.map((ref) => ref.ref.replace('refs/heads/', '')),
              ].join(' '));
              return;
            }

            let branchName = matchingRefs.length === 1
              ? matchingRefs[0].ref.replace('refs/heads/', '')
              : requestedBranchName;
            let branchCreated = false;

            if (matchingRefs.length === 0) {

              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/heads/${branchName}`,
                  sha: baseRef.data.object.sha,
                });
                branchCreated = true;
              } catch (createError) {
                if (createError.status !== 422) throw createError;

                matchingRefs = await findBranchesForTicket();
                if (matchingRefs.length !== 1) {
                  throw createError;
                }
                branchName = matchingRefs[0].ref.replace('refs/heads/', '');
              }
            }

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });

            let issue = existingIssues.find((item) =>
              !item.pull_request
              && (item.title === title || String(item.body ?? '').includes(marker))
            );
            let issueCreated = false;

            if (!issue) {
              issue = (await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  marker,
                  `Jira: ${jiraUrl}`,
                  `Branch: \`${branchName}\``,
                  '',
                  description.slice(0, 60000),
                ].join('\n'),
              })).data;
              issueCreated = true;
            }

            core.notice([
              `GitHub issue #${issue.number} ${issueCreated ? 'created' : 'already existed'}.`,
              `Branch ${branchName} ${branchCreated ? 'created' : 'already existed'}.`,
            ].join(' '));
