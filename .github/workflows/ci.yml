name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bancassurance
          MYSQL_USER: banca
          MYSQL_PASSWORD: banca
          MYSQL_ROOT_PASSWORD: root
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ubanca -pbanca"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TZ: UTC
      DB_URL: jdbc:mysql://127.0.0.1:3306/bancassurance?serverTimezone=UTC
      DB_USERNAME: banca
      DB_PASSWORD: banca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build
